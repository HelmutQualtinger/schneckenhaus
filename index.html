<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------------------------------------------------------------------------
// Presets: geometry parameters + texture palette
// ---------------------------------------------------------------------------
const PRESETS = {
  schnecke: {
    psi: 9, turns: 6, T: 1.6,
    bivalve: false, overlap: 1.12, b: 1.0, ribAmp: 0.0, ribs: 0,
    pattern: 'zickzack', inner: { color:0xe8c7ad, iridescence:0.15 }
  },
  nautilus: {
    psi: 10, turns: 3, T: 0,
    bivalve: false, overlap: 1.9, b: 0.8, ribAmp: 0.0, ribs: 0,
    pattern: 'tiger', inner: { color:0xf3ede6, iridescence:1.0 }
  },
  muschel: {
    psi: 40, turns: 0.45, T: 0.15,
    bivalve: true, overlap: 1, b: 0.85, ribAmp: 0.022, ribs: 26,
    pattern: 'rippen', inner: { color:0xf6f0ea, iridescence:0.9 }
  },
  ammonit: {
    psi: 5.5, turns: 5, T: 0,
    bivalve: false, overlap: 1.05, b: 0.8, ribAmp: 0.0, ribs: 0,
    crossRibs: 30, crossRibAmp: 0.07,          // radial ribs across the whorl (per turn)
    pattern: 'fossil', inner: { color:0xb9a58c, iridescence:0.6 }
  }
};

// ---------------------------------------------------------------------------
// 10 texture patterns (all values optional, see PATTERN_DEFAULTS)
// ---------------------------------------------------------------------------
const PATTERN_DEFAULTS = {
  base:[220,200,170], mid:[170,130,90], dark:[90,55,35],
  bands:0, bandStrength:0, flames:0, zig:0, zigAmp:0, flameLo:0.6, flameHi:0.85, flameStrength:0,
  growth:150, growthDark:0.12, cords:0, cordDark:0, growthBump:1.0, cordBump:0,
  spots:0, spotSize:0.3, spotRing:false, checkerU:0, checkerV:0, checkerStrength:0,
  ca:false, caStrength:0, bump:1.2
};
const PATTERNS = {
  zickzack:   { name:'Zickzack-Flammen', base:[200,164,116], mid:[150,108,66], dark:[84,52,30],
                bands:3, bandStrength:0.55, flames:9, zig:4, zigAmp:0.6, flameStrength:0.5,
                growth:170, growthDark:0.16, cords:40, cordDark:0.04, cordBump:0.25, bump:1.2 },
  tiger:      { name:'Tigerstreifen (Nautilus)', base:[238,228,210], mid:[222,204,176], dark:[136,66,36],
                flames:11, zig:1, zigAmp:0.7, flameLo:0.5, flameHi:0.68, flameStrength:0.85,
                growth:140, growthDark:0.07, growthBump:0.8, bump:0.8 },
  rippen:     { name:'Herzmuschel-Rippen', base:[228,208,176], mid:[196,146,98], dark:[118,68,42],
                flames:6, flameLo:0.6, flameHi:0.92, flameStrength:0.5,
                growth:150, growthDark:0.2, cords:26, cordDark:0.22, growthBump:0.9, cordBump:1.0, bump:1.5 },
  baender:    { name:'Bänderschnecke', base:[228,198,92], mid:[72,42,26], dark:[72,42,26],
                bands:5, bandStrength:0.92, growth:160, growthDark:0.1, bump:0.9 },
  zelt:       { name:'Zeltmuster (Kegelschnecke)', base:[242,230,206], dark:[92,52,28],
                ca:true, caStrength:0.92, growth:200, growthDark:0.06, growthBump:0.5, bump:0.7 },
  punkte:     { name:'Leopardenpunkte', base:[214,172,116], mid:[160,110,60], dark:[64,36,20],
                spots:14, spotSize:0.3, spotRing:true, growth:120, growthDark:0.03, growthBump:0.3, bump:0.5 },
  schach:     { name:'Würfelmuster', base:[236,222,196], dark:[128,52,36],
                checkerU:14, checkerV:10, checkerStrength:0.85, growth:160, growthDark:0.08, bump:0.8 },
  porzellan:  { name:'Porzellanweiß', base:[240,230,214], mid:[226,180,166],
                bands:2, bandStrength:0.45, growth:180, growthDark:0.05, growthBump:0.6, bump:0.6 },
  gerippt:    { name:'Dunkel gerippt', base:[96,64,44], mid:[70,46,32], dark:[48,30,20],
                flames:5, flameStrength:0.3, cords:30, cordDark:-0.45, cordBump:1.0,
                growth:160, growthDark:0.1, bump:1.6 },
  wellen:     { name:'Feine Wellenlinien', base:[214,194,162], mid:[180,150,115], dark:[78,56,40],
                bands:2, bandStrength:0.3, flames:18, zig:6, zigAmp:1.2, flameLo:0.86, flameHi:0.95, flameStrength:0.9,
                growth:160, growthDark:0.06, bump:0.7 },
  fossil:     { name:'Fossil (Ammonit)', base:[158,132,104], mid:[118,96,74], dark:[84,66,50],
                bands:1, bandStrength:0.25, flames:3, zigAmp:0.4, flameLo:0.55, flameHi:0.9, flameStrength:0.3,
                growth:110, growthDark:0.12, growthBump:0.8, bump:1.4 }
};

// ---------------------------------------------------------------------------
// Procedural, seamlessly tileable shell texture (color + height)
// ---------------------------------------------------------------------------
function hash(i, j, seed) {
  let h = Math.imul(i, 374761393) ^ Math.imul(j, 668265263) ^ Math.imul(seed, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, Px, Py, seed) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const fx = x - xi, fy = y - yi;
  const x0 = ((xi % Px) + Px) % Px, x1 = (x0 + 1) % Px;
  const y0 = ((yi % Py) + Py) % Py, y1 = (y0 + 1) % Py;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const a = hash(x0, y0, seed), b = hash(x1, y0, seed), c = hash(x0, y1, seed), d = hash(x1, y1, seed);
  return (a + (b - a) * sx) + ((c + (d - c) * sx) - (a + (b - a) * sx)) * sy;
}
// periodic fbm on the unit square; fu/fv = integer base frequencies
function fbm(u, v, fu, fv, oct, seed) {
  let sum = 0, amp = 0.5, norm = 0;
  for (let o = 0; o < oct; o++) {
    const m = 1 << o;
    sum += amp * vnoise(u * fu * m, v * fv * m, fu * m, fv * m, seed + o * 17);
    norm += amp; amp *= 0.5;
  }
  return sum / norm;
}
const frac = x => x - Math.floor(x);
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// Rule-30 cellular automaton: rows = growth steps (u), cells = mantle edge (v), periodic in v.
// Produces the triangle ("tent") pattern of cone shells.
function makeCA(cells, steps, seed) {
  const g = new Uint8Array(cells * steps);
  for (let c = 0; c < cells; c++) g[c] = hash(c, 7, seed) < 0.5 ? 1 : 0;
  for (let t = 1; t < steps; t++) {
    for (let c = 0; c < cells; c++) {
      const l = g[(t - 1) * cells + (c - 1 + cells) % cells], m = g[(t - 1) * cells + c], r = g[(t - 1) * cells + (c + 1) % cells];
      g[t * cells + c] = l ^ (m | r);
    }
  }
  return g;
}
// periodic Worley distance (nearest jittered point) on an N x N grid
function worley(u, v, N, seed) {
  const x = u * N, y = v * N, xi = Math.floor(x), yi = Math.floor(y);
  let best = 9;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const cx = xi + dx, cy = yi + dy;
    const wx = ((cx % N) + N) % N, wy = ((cy % N) + N) % N;
    const px = cx + 0.2 + 0.6 * hash(wx, wy, seed), py = cy + 0.2 + 0.6 * hash(wx, wy, seed + 1);
    const d = Math.hypot(px - x, py - y);
    if (d < best) best = d;
  }
  return best;
}

function makeShellTextures(patternIn, size = 1024) {
  const P = { ...PATTERN_DEFAULTS, ...patternIn };
  const CA_CELLS = 160, CA_STEPS = 220;
  const caGrid = P.ca ? makeCA(CA_CELLS, CA_STEPS, 5) : null;
  const cC = document.createElement('canvas'), cH = document.createElement('canvas');
  cC.width = cC.height = cH.width = cH.height = size;
  const ctxC = cC.getContext('2d'), ctxH = cH.getContext('2d');
  const imgC = ctxC.createImageData(size, size), imgH = ctxH.createImageData(size, size);
  const TAU = Math.PI * 2;
  for (let y = 0; y < size; y++) {
    const v = y / size;                       // around the tube (spiral direction = constant v)
    for (let x = 0; x < size; x++) {
      const u = x / size;                     // along growth direction (growth lines = constant u)
      const n  = fbm(u, v, 4, 4, 5, 11);
      const ns = fbm(u, v, 48, 3, 3, 71);     // streaks along growth lines
      let r = P.base[0], g = P.base[1], b = P.base[2];
      const tone = 0.82 + 0.36 * n;
      r *= tone; g *= tone; b *= tone;
      // spiral color bands
      if (P.bandStrength > 0) {
        const bv = 0.5 + 0.5 * Math.sin(TAU * (v * P.bands + 0.25 * (n - 0.5)));
        const m = smooth(0.55, 0.8, bv) * P.bandStrength;
        r += (P.mid[0] - r) * m; g += (P.mid[1] - g) * m; b += (P.mid[2] - b) * m;
      }
      // flames / zig-zag stripes parallel to growth lines
      if (P.flameStrength > 0) {
        const zig = Math.abs(frac(v * P.zig) - 0.5) * 2;
        const ph = u * P.flames + zig * P.zigAmp + (n - 0.5) * 0.9 + (ns - 0.5) * 0.15;
        const f = 0.5 + 0.5 * Math.sin(TAU * ph);
        const m = smooth(P.flameLo, P.flameHi, f) * P.flameStrength;
        r += (P.dark[0] - r) * m; g += (P.dark[1] - g) * m; b += (P.dark[2] - b) * m;
      }
      // spots (optionally with a lighter halo)
      if (P.spots > 0) {
        const d = worley(u + (n - 0.5) * 0.02, v, P.spots, 31);
        const m = 1 - smooth(P.spotSize * 0.75, P.spotSize, d);
        if (P.spotRing) {
          const halo = (1 - smooth(P.spotSize, P.spotSize * 1.35, d)) * 0.6;
          r += (P.mid[0] * 1.25 - r) * halo * (1 - m); g += (P.mid[1] * 1.25 - g) * halo * (1 - m); b += (P.mid[2] * 1.25 - b) * halo * (1 - m);
        }
        r += (P.dark[0] - r) * m; g += (P.dark[1] - g) * m; b += (P.dark[2] - b) * m;
      }
      // checker / tessellated squares
      if (P.checkerStrength > 0) {
        const cu = Math.floor(u * P.checkerU + (n - 0.5) * 0.35), cv = Math.floor(v * P.checkerV + (ns - 0.5) * 0.25);
        const m = (((cu + cv) % 2) + 2) % 2 * P.checkerStrength * (0.85 + 0.3 * (n - 0.5));
        r += (P.dark[0] - r) * m; g += (P.dark[1] - g) * m; b += (P.dark[2] - b) * m;
      }
      // cellular automaton (cone-shell tents), bilinear sampled
      if (caGrid) {
        const fx = u * (CA_STEPS - 1), fy = v * CA_CELLS;
        const t0 = Math.floor(fx), c0 = Math.floor(fy) % CA_CELLS;
        const t1 = Math.min(CA_STEPS - 1, t0 + 1), c1 = (c0 + 1) % CA_CELLS;
        const ax = fx - t0, ay = fy - Math.floor(fy);
        const val = (caGrid[t0 * CA_CELLS + c0] * (1 - ax) + caGrid[t1 * CA_CELLS + c0] * ax) * (1 - ay)
                  + (caGrid[t0 * CA_CELLS + c1] * (1 - ax) + caGrid[t1 * CA_CELLS + c1] * ax) * ay;
        const m = smooth(0.35, 0.65, val) * P.caStrength;
        r += (P.dark[0] - r) * m; g += (P.dark[1] - g) * m; b += (P.dark[2] - b) * m;
      }
      const streak = 0.9 + 0.2 * ns;
      r *= streak; g *= streak; b *= streak;
      // growth lines (asymmetric increments)
      const gl = frac(u * P.growth + (n - 0.5) * 2.0);
      const line = smooth(0.8, 1.0, gl);
      const fine = smooth(0.7, 1.0, frac(u * P.growth * 3.0 + (ns - 0.5) * 1.5));
      const gd = 1 - P.growthDark * line - 0.06 * fine;
      // spiral cords / radial ribs
      const cord = P.cords > 0 ? 0.5 + 0.5 * Math.cos(TAU * v * P.cords) : 0.5;
      const cd = 1 - P.cordDark * (1 - cord);
      r *= gd * cd; g *= gd * cd; b *= gd * cd;

      const i = (y * size + x) * 4;
      imgC.data[i] = Math.min(255, r); imgC.data[i + 1] = Math.min(255, g); imgC.data[i + 2] = Math.min(255, b); imgC.data[i + 3] = 255;
      let h = 0.35 + 0.35 * line * P.growthBump + 0.1 * fine * P.growthBump + (cord - 0.5) * 0.5 * P.cordBump + 0.15 * (n - 0.5) + 0.1 * (ns - 0.5);
      h = Math.min(255, Math.max(0, h * 255));
      imgH.data[i] = imgH.data[i + 1] = imgH.data[i + 2] = h; imgH.data[i + 3] = 255;
    }
  }
  ctxC.putImageData(imgC, 0, 0); ctxH.putImageData(imgH, 0, 0);
  const map = new THREE.CanvasTexture(cC), bump = new THREE.CanvasTexture(cH);
  for (const t of [map, bump]) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 8;
  }
  map.colorSpace = THREE.SRGBColorSpace;
  return { map, bump };
}

// ---------------------------------------------------------------------------
// Shell geometry: logarithmic helico-spiral (Raup's coiling model)
//   psi   – Öffnungswinkel: angle of the log. spiral -> expansion rate W = e^(2π tan psi)
//   turns – Länge: number of whorls
//   T     – Steigung: translation along the coiling axis per unit radius
// ---------------------------------------------------------------------------
function buildShellGeometry(p) {
  const k = Math.tan(p.psi * Math.PI / 180);
  const W = Math.exp(2 * Math.PI * k);
  const thetaLen = p.turns * 2 * Math.PI;
  const T = p.T, b = p.b;

  let ratio; // tube radius / distance of tube center from axis
  if (p.bivalve) ratio = 1.0;
  else {
    ratio = (1 - 1 / W) * Math.sqrt(1 + T * T) / (1 + 1 / W) * p.overlap;
    ratio = Math.min(1.0, Math.max(0.04, ratio));
  }

  // sharp apex: continue the spiral backwards (hidden early whorls) until the tube is tiny,
  // then close it in a single point on the coiling axis (the limit point of the log. spiral)
  const theta0 = p.bivalve ? 0 : -Math.min(Math.log(40) / k, 3 * 2 * Math.PI);
  const totalTurns = (thetaLen - theta0) / (2 * Math.PI);
  const perTurn = p.res ? p.res.perTurn : (p.crossRibs ? 360 : 180);
  const nT = p.res ? Math.max(80, Math.ceil(totalTurns * perTurn))
                   : Math.min(2400, Math.max(80, Math.ceil(totalTurns * perTurn)));
  const rows = nT + 2;                               // row 0 = apex point
  const nS = p.res ? p.res.around : 128;
  const tubeA = new Float32Array(rows);              // tube radius per row (for STL wall thickness)
  const speed = Math.sqrt(1 + k * k + (T * k) * (T * k));
  const tilesPerTurn = speed / (ratio * (1 + b) / 2);   // keeps texture texels roughly square

  const pos = new Float32Array(rows * (nS + 1) * 3);
  const uv  = new Float32Array(rows * (nS + 1) * 2);
  let pi = 0, ui = 0;
  for (let i = 0; i < rows; i++) {
    const apex = i === 0;
    const th = apex ? theta0 : theta0 + (thetaLen - theta0) * (i - 1) / nT;   // growth from apex to aperture
    const R = apex ? 0 : Math.exp(k * th);
    const a = ratio * R;
    tubeA[i] = a;
    const cx = Math.cos(th), cy = Math.sin(th);
    const cz = p.bivalve ? T * R : -T * R;
    const u = th / (2 * Math.PI) * tilesPerTurn;
    for (let j = 0; j <= nS; j++) {
      const s = -Math.PI + 2 * Math.PI * j / nS;    // seam on the inner (columellar) side
      let rib = 1 + p.ribAmp * Math.cos(p.ribs * s);
      if (p.crossRibs) {
        // sharp ribs across the whorl, strongest on the outer flank (s = 0)
        const c = Math.pow(0.5 + 0.5 * Math.cos(p.crossRibs * th), 4);
        rib += p.crossRibAmp * c * (0.3 + 0.7 * (0.5 + 0.5 * Math.cos(s)));
      }
      const rr = R + a * rib * Math.cos(s);
      pos[pi++] = rr * cx;
      pos[pi++] = rr * cy;
      pos[pi++] = cz + a * rib * b * Math.sin(s);
      uv[ui++] = u;
      uv[ui++] = j / nS;
    }
  }
  const idx = [];
  for (let i = 0; i < rows - 1; i++) {
    for (let j = 0; j < nS; j++) {
      const a0 = i * (nS + 1) + j, a1 = (i + 1) * (nS + 1) + j;
      idx.push(a0, a1, a1 + 1, a0, a1 + 1, a0 + 1);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return { geo, W, ratio, rows, nS, tubeA };
}

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

const scene = new THREE.Scene();

scene.environmentIntensity = 0.7;

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
camera.position.set(3.2, 1.6, 5.2);
const controls = new OrbitControls(camera, renderer.domElement);
window.shellApp = { scene, camera, renderer, controls, get root() { return root; } };   // handle for screenshot scripts
controls.enableDamping = true;

const key = new THREE.DirectionalLight(0xfff1dc, 2.2);
key.position.set(4, 6, 5);

rim.position.set(-5, 2, -4);

const outerMat = new THREE.MeshPhysicalMaterial({
  roughness: 0.42, clearcoat: 0.55, clearcoatRoughness: 0.35, sheen: 0.2, side: THREE.FrontSide
});
const innerMat = new THREE.MeshPhysicalMaterial({
  roughness: 0.12, clearcoat: 1.0, clearcoatRoughness: 0.05,
  iridescenceIOR: 1.6, iridescenceThicknessRange: [180, 620], side: THREE.BackSide
});

const root = new THREE.Group();     // fitting (scale / position)
const orient = new THREE.Group();   // orientation of the coiling axis
root.add(orient);
scene.add(root);

let currentPreset = 'schnecke';
let params = { ...PRESETS.schnecke };
let geo = null;

const thumbs = {};
let currentPattern = null;
const textureCache = {};   // generated textures per pattern (generation takes a moment)
function applyPattern(key) {
  const P = PATTERNS[key];
  if (!textureCache[key]) textureCache[key] = makeShellTextures(P);
  const { map, bump } = textureCache[key];
  outerMat.map = map;
  outerMat.bumpMap = bump;
  outerMat.bumpScale = P.bump ?? PATTERN_DEFAULTS.bump;
  outerMat.needsUpdate = true;
  currentPattern = key;
  if (thumbs[key]) patternBtnImg.src = thumbs[key];
  patternPopup.querySelectorAll('img').forEach(im => im.classList.toggle('active', im.dataset.key === key));
}
function applyInner(presetName) {
  const P = PRESETS[presetName];
  innerMat.color.setHex(P.inner.color);
  innerMat.iridescence = P.inner.iridescence;
  innerMat.needsUpdate = true;
}

function rebuild(refit = true) {
  while (orient.children.length) orient.remove(orient.children[0]);
  if (geo) geo.dispose();
  const res = buildShellGeometry(params);
  geo = res.geo;

  const thetaLen = params.turns * 2 * Math.PI;
  const makeValve = () => {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(geo, outerMat), new THREE.Mesh(geo, innerMat));
    return g;
  };

  if (params.bivalve) {
    // two mirrored valves, hinged at the coiling axis (z), slightly opened
    const open = 0.07;
    // rotate so the margin (aperture) lies in the commissure plane y = 0; the umbo stays at the hinge
    const v1 = makeValve(); v1.rotation.z = -thetaLen - open;
    const v2wrap = new THREE.Group(); v2wrap.scale.y = -1;
    const v2 = makeValve(); v2.rotation.z = -thetaLen - open;
    v2wrap.add(v2);
    orient.add(v1, v2wrap);
    orient.rotation.set(0, 0, 0);              // commissure plane horizontal
  } else {
    orient.add(makeValve());
    // planispiral (no translation): show the spiral side; otherwise coiling axis vertical, apex up
    if (params.T < 0.05) orient.rotation.set(0, 0, 0);
    else orient.rotation.set(-Math.PI / 2, 0, 0);
  }

  // fit into view (not when only the length changes: apex stays fixed, shell grows at the aperture)
  if (refit) fitView();
  showInfo(res);
}

// fit target; animated = smooth transition (used after the length slider is released)
const fitTarget = { scale: 1, pos: new THREE.Vector3(), active: false };
function fitView(animated = false) {
  const oldS = root.scale.x, oldP = root.position.clone();
  root.scale.setScalar(1); root.position.set(0, 0, 0);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(orient);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  // narrow (portrait) screens: shrink to fit the width and move up above the bottom panel
  const narrow = innerWidth <= 640;
  const s = 1.6 * Math.min(1, camera.aspect / 1.1) * (narrow ? 0.85 : 1) / sphere.radius;
  fitTarget.scale = s;
  fitTarget.pos.copy(sphere.center).multiplyScalar(-s);
  if (narrow) fitTarget.pos.y += 0.9;
  if (animated) {
    root.scale.setScalar(oldS); root.position.copy(oldP);
    fitTarget.active = true;
  } else {
    root.scale.setScalar(s); root.position.copy(fitTarget.pos);
    fitTarget.active = false;
  }
}
function updateFit() {
  if (!fitTarget.active) return;
  const t = 0.12;
  // interpolate scale logarithmically (sizes differ by orders of magnitude)
  const ls = Math.log(root.scale.x), lt = Math.log(fitTarget.scale);
  root.scale.setScalar(Math.exp(ls + (lt - ls) * t));
  root.position.lerp(fitTarget.pos, t);
  if (Math.abs(lt - ls) < 1e-3 && root.position.distanceTo(fitTarget.pos) < 1e-3) {
    root.scale.setScalar(fitTarget.scale); root.position.copy(fitTarget.pos);
    fitTarget.active = false;
  }
}

function showInfo(res) {
  document.getElementById('info').innerHTML =
    `Erweiterungsrate W = ${res.W < 1000 ? res.W.toFixed(2) : res.W.toExponential(1)} pro Windung<br>` +
    `Röhrenverhältnis a/R = ${res.ratio.toFixed(2)}<br>` +
    `Maus: Drehen · Mausrad: Zoom · Rechte Taste: Verschieben`;
}

// ---------------------------------------------------------------------------
// STL export: closed solid (outer surface with texture relief, inner surface offset by the
// wall thickness, rim at the aperture), per-facet colours from the texture (Materialise Magics
// convention: "COLOR=" in the header, 15-bit colour in the attribute bytes), millimetres, Z up.
// ---------------------------------------------------------------------------
const STL_RES = {
  draft:    { perTurn: 120, around: 96 },
  standard: { perTurn: 240, around: 160 },
  fine:     { perTurn: 400, around: 256 }
};

function imageSampler(canvas, blurPx = 0) {
  const w = canvas.width, h = canvas.height;
  let src = canvas;
  if (blurPx > 0.5) {
    // tile 3x3 before blurring so the blur wraps seamlessly
    const big = document.createElement('canvas'); big.width = w * 3; big.height = h * 3;
    const bc = big.getContext('2d');
    bc.filter = `blur(${blurPx}px)`;
    for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) bc.drawImage(canvas, x * w, y * h);
    src = document.createElement('canvas'); src.width = w; src.height = h;
    src.getContext('2d').drawImage(big, w, h, w, h, 0, 0, w, h);
  }
  const d = src.getContext('2d').getImageData(0, 0, w, h).data;
  const wrap = (x, n) => ((x % n) + n) % n;
  return {
    // bilinear, red channel, 0..1
    height(u, v) {
      const x = wrap(u * w - 0.5, w), y = wrap(v * h - 0.5, h);
      const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
      const x1 = (x0 + 1) % w, y1 = (y0 + 1) % h;
      const p = (xx, yy) => d[(yy * w + xx) * 4];
      return ((p(x0, y0) * (1 - fx) + p(x1, y0) * fx) * (1 - fy) + (p(x0, y1) * (1 - fx) + p(x1, y1) * fx) * fy) / 255;
    },
    rgb(u, v) {
      const i = (Math.floor(wrap(v * h, h)) * w + Math.floor(wrap(u * w, w))) * 4;
      return [d[i], d[i + 1], d[i + 2]];
    }
  };
}

// Materialise Magics colour convention: bit 15 = 0 -> facet has its own colour, red in the low bits
const rgb15 = (r, g, b) => ((b >> 3) << 10) | ((g >> 3) << 5) | (r >> 3);

function buildSTL({ sizeMM, wallMM, reliefMM, quality }) {
  const res = STL_RES[quality] || STL_RES.standard;
  const shell = buildShellGeometry({ ...params, res });
  const { geo: g, rows, nS, tubeA } = shell;
  const cols = nS + 1;
  const P = g.attributes.position.array, N = g.attributes.normal.array, UV = g.attributes.uv.array;
  // identical normals on the seam column
  for (let i = 0; i < rows; i++) {
    const a = i * cols * 3, b = (i * cols + nS) * 3;
    for (let c = 0; c < 3; c++) { const m = (N[a + c] + N[b + c]) / 2; N[a + c] = N[b + c] = m; }
  }

  // samplers; blur the height map to the mesh resolution to avoid aliasing
  const tex = textureCache[currentPattern];
  const texSize = tex.map.image.width;
  const tiles = (UV[(rows - 1) * cols * 2] - UV[cols * 2]) / Math.max(1e-6, rows - 2);   // u per row
  const blur = Math.max(0, Math.min(8, 0.5 * Math.max(tiles * texSize, texSize / nS)));
  const hS = imageSampler(tex.bump.image, blur), cS = imageSampler(tex.map.image, blur);   // colour averaged per facet

  // valve transforms relative to the fitted root (includes orientation / mirroring)
  root.updateMatrixWorld(true);
  const rootInv = root.matrixWorld.clone().invert();
  const mats = [];
  orient.traverse(o => { if (o.isMesh && o.material === outerMat) mats.push(rootInv.clone().multiply(o.matrixWorld)); });

  // scale to mm from the bounding box of the undisplaced shell
  const box = new THREE.Box3(), v = new THREE.Vector3();
  for (const m of mats) for (let i = 0; i < P.length; i += 3) box.expandByPoint(v.set(P[i], P[i + 1], P[i + 2]).applyMatrix4(m));
  const dims = box.getSize(new THREE.Vector3());
  const scale = sizeMM / Math.max(dims.x, dims.y, dims.z);
  const wall = wallMM / scale, relief = reliefMM / scale;

  // displaced outer and offset inner vertex grids (local shell space)
  const nv = rows * cols;
  const O = new Float32Array(nv * 3), I = new Float32Array(nv * 3);
  for (let i = 0; i < rows; i++) {
    const a = tubeA[i];
    const t = Math.min(wall, 0.45 * a), r = Math.min(relief, 0.2 * a);
    for (let j = 0; j < cols; j++) {
      const k = i * cols + j, k3 = k * 3;
      const jj = j === nS ? 0 : j;                                   // seam column = column 0
      const h = hS.height(UV[k * 2], UV[(i * cols + jj) * 2 + 1]);
      for (let c = 0; c < 3; c++) {
        O[k3 + c] = P[k3 + c] + N[k3 + c] * r * h;
        I[k3 + c] = P[k3 + c] - N[k3 + c] * t;
      }
    }
  }
  // make seam column bit-identical to column 0 (watertight)
  for (let i = 0; i < rows; i++) for (let c = 0; c < 3; c++) {
    O[(i * cols + nS) * 3 + c] = O[i * cols * 3 + c];
    I[(i * cols + nS) * 3 + c] = I[i * cols * 3 + c];
  }

  // face colours
  const ih = innerMat.color.getHex();   // sRGB
  const innerCol = rgb15((ih >> 16) & 255, (ih >> 8) & 255, ih & 255);
  const rimCol = rgb15(...cS.rgb(UV[(rows - 1) * cols * 2], 0.5));

  // triangle list: [grid, idxA, idxB, idxC, colour]
  const triPerValve = 4 * (rows - 1) * nS;   // outer + inner (minus apex) + rim
  const total = triPerValve * mats.length;
  const out = new Float32Array(total * 9);
  const colors = new Uint16Array(total);
  let n = 0;
  const tmp = new THREE.Vector3();
  const minV = new THREE.Vector3(Infinity, Infinity, Infinity), maxV = new THREE.Vector3(-Infinity, -Infinity, -Infinity);

  for (const m of mats) {
    const flip = m.determinant() < 0;
    const put = (G1, a, G2, b, G3, c, col) => {
      if (flip) { const tg = G2, tb = b; G2 = G3; b = c; G3 = tg; c = tb; }
      const o = n * 9;
      for (const [G, idx, off] of [[G1, a, 0], [G2, b, 3], [G3, c, 6]]) {
        tmp.set(G[idx * 3], G[idx * 3 + 1], G[idx * 3 + 2]).applyMatrix4(m).multiplyScalar(scale);
        // three.js Y-up -> STL Z-up
        out[o + off] = tmp.x; out[o + off + 1] = -tmp.z; out[o + off + 2] = tmp.y;
        minV.min(v.set(out[o + off], out[o + off + 1], out[o + off + 2]));
        maxV.max(v);
      }
      colors[n++] = col;
    };
    for (let i = 0; i < rows - 1; i++) {
      for (let j = 0; j < nS; j++) {
        const a0 = i * cols + j, a1 = (i + 1) * cols + j;
        const uc = (UV[a0 * 2] + UV[a1 * 2]) / 2, vc = (j + 0.5) / nS;
        const col = rgb15(...cS.rgb(uc, vc));
        // outer surface (same winding as the render mesh -> normals point outward)
        put(O, a0, O, a1, O, a1 + 1, col);
        if (i > 0) put(O, a0, O, a1 + 1, O, a0 + 1, col);
        // inner surface (reversed)
        put(I, a0, I, a1 + 1, I, a1, innerCol);
        if (i > 0) put(I, a0, I, a0 + 1, I, a1 + 1, innerCol);
      }
    }
    // rim at the aperture
    const L = (rows - 1) * cols;
    for (let j = 0; j < nS; j++) {
      put(O, L + j, I, L + j + 1, O, L + j + 1, rimCol);
      put(O, L + j, I, L + j, I, L + j + 1, rimCol);
    }
  }

  // binary STL; centre on the bed, lowest point at z = 0
  const cx = (minV.x + maxV.x) / 2, cy = (minV.y + maxV.y) / 2, cz = minV.z;
  const buf = new ArrayBuffer(84 + n * 50);
  const dv = new DataView(buf);
  const header = `Schneckenhaus3D ${params.psi.toFixed(1)}deg ${params.turns.toFixed(2)}w T${params.T.toFixed(2)} ${currentPattern} COLOR=`;
  for (let i = 0; i < 80; i++) dv.setUint8(i, i < header.length ? header.charCodeAt(i) & 0x7f : 0x20);
  // default colour (RGBA) right after "COLOR="
  const [dr, dg, db] = cS.rgb(0.5, 0.5);
  dv.setUint8(header.length, dr); dv.setUint8(header.length + 1, dg); dv.setUint8(header.length + 2, db); dv.setUint8(header.length + 3, 255);
  dv.setUint32(80, n, true);
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
  let off = 84;
  for (let t = 0; t < n; t++) {
    const o = t * 9;
    A.set(out[o] - cx, out[o + 1] - cy, out[o + 2] - cz);
    B.set(out[o + 3] - cx, out[o + 4] - cy, out[o + 5] - cz);
    C.set(out[o + 6] - cx, out[o + 7] - cy, out[o + 8] - cz);
    const nrm = tmp.subVectors(C, B).cross(v.subVectors(A, B)).normalize();
    for (const q of [nrm, A, B, C]) {
      dv.setFloat32(off, q.x || 0, true); dv.setFloat32(off + 4, q.y || 0, true); dv.setFloat32(off + 8, q.z || 0, true);
      off += 12;
    }
    dv.setUint16(off, colors[t], true); off += 2;
  }
  g.dispose();
  return { buf, triangles: n, size: [maxV.x - minV.x, maxV.y - minV.y, maxV.z - minV.z] };
}

document.getElementById('stlBtn').addEventListener('click', () => {
  const btn = document.getElementById('stlBtn'), hint = document.getElementById('stlHint');
  btn.disabled = true; btn.textContent = 'Erzeuge STL …';
  setTimeout(() => {
    try {
      const opts = {
        sizeMM: +document.getElementById('stlSize').value || 80,
        wallMM: +document.getElementById('stlWall').value || 1.2,
        reliefMM: +document.getElementById('stlRelief').value || 0,
        quality: document.getElementById('stlQuality').value
      };
      const { buf, triangles, size } = buildSTL(opts);
      const name = `${currentPreset}-${currentPattern}-${params.psi.toFixed(0)}deg-${params.turns.toFixed(1)}w.stl`;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([buf], { type: 'model/stl' }));
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      hint.textContent = `${name}: ${triangles.toLocaleString('de-DE')} Dreiecke, ` +
        `${(buf.byteLength / 1e6).toFixed(1)} MB, ${size.map(x => x.toFixed(1)).join(' × ')} mm`;
    } catch (err) {
      hint.textContent = 'Export fehlgeschlagen: ' + err.message;
      console.error(err);
    }
    btn.disabled = false; btn.textContent = 'STL herunterladen';
  }, 30);
});

// ---------------------------------------------------------------------------
// Control panel: drag by its header, minimise, remember state
// ---------------------------------------------------------------------------
const panel = document.getElementById('panel');
const panelHead = document.getElementById('panelHead');
const panelMin = document.getElementById('panelMin');
const PANEL_KEY = 'schneckenhaus-panel';

function placePanel(x, y) {
  const r = panel.getBoundingClientRect();
  const maxX = Math.max(0, innerWidth - r.width), maxY = Math.max(0, innerHeight - r.height);   // whole panel stays visible
  x = Math.min(maxX, Math.max(0, x)); y = Math.min(maxY, Math.max(0, y));
  Object.assign(panel.style, { left: x + 'px', top: y + 'px', right: 'auto', bottom: 'auto' });
  if (!panel.classList.contains('minimized')) panel.style.width = r.width + 'px';   // keep full width while minimised
}
function savePanel() {
  const moved = panel.style.left !== '';
  const r = panel.getBoundingClientRect();
  localStorage.setItem(PANEL_KEY, JSON.stringify({
    min: panel.classList.contains('minimized'), x: moved ? r.left : null, y: moved ? r.top : null,
    w: moved && panel.style.width ? parseFloat(panel.style.width) : null }));
}
function setMinimized(min) {
  panel.classList.toggle('minimized', min);
  panelMin.textContent = min ? '+' : '–';
  panelMin.title = min ? 'Wiederherstellen' : 'Minimieren';
}
function toggleMinimized() {
  setMinimized(!panel.classList.contains('minimized'));
  if (panel.style.left !== '') { const r = panel.getBoundingClientRect(); placePanel(r.left, r.top); }
  savePanel();
}
panelMin.addEventListener('click', toggleMinimized);
panelMin.addEventListener('pointerdown', e => e.stopPropagation());   // don't start a drag on the button

let drag = null;
panelHead.addEventListener('pointerdown', e => {
  const r = panel.getBoundingClientRect();
  drag = { dx: e.clientX - r.left, dy: e.clientY - r.top, moved: false };
  panelHead.setPointerCapture(e.pointerId);
});
panelHead.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved) { drag.moved = true; panel.classList.add('dragging'); patternPopup.classList.remove('open'); }
  placePanel(e.clientX - drag.dx, e.clientY - drag.dy);
});
const endDrag = () => {
  if (!drag) return;
  panel.classList.remove('dragging');
  if (drag.moved) savePanel();
  drag = null;
};
panelHead.addEventListener('pointerup', endDrag);
panelHead.addEventListener('pointercancel', endDrag);
// double-click on the header toggles minimise
panelHead.addEventListener('dblclick', toggleMinimized);

try {
  const st = JSON.parse(localStorage.getItem(PANEL_KEY) || 'null');
  if (st) {
    setMinimized(!!st.min);
    if (st.x !== null) { if (st.w) panel.style.width = st.w + 'px'; placePanel(st.x, st.y); }
  }
} catch (_) {}
addEventListener('resize', () => {
  if (panel.style.left !== '') { const r = panel.getBoundingClientRect(); placePanel(r.left, r.top); }
});

// URL parameters: ?preset=nautilus&pattern=zelt&psi=..&turns=..&T=..&clean (clean = hide UI)
const q = new URLSearchParams(location.search);
loadPreset(PRESETS[q.get('preset')] ? q.get('preset') : 'schnecke');
if (PATTERNS[q.get('pattern')]) applyPattern(q.get('pattern'));
let qChanged = false;
for (const [id, el] of [['psi', elPsi], ['turns', elTurns], ['T', elT]]) {
  if (q.has(id)) { el.value = q.get(id); qChanged = true; }
}
if (qChanged) onSlider({ target: elPsi });
if (q.has('clean')) { document.body.classList.add('clean'); controls.autoRotate = false; }

// offline support / installable app (PWA)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
renderer.setAnimationLoop(() => { updateFit(); controls.update(); renderer.render(scene, camera); });
</script>
